<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ATLAS AI CORE OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    input { user-select: text; -webkit-user-select: text; }
    :focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .pill-dot { animation: none; } }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #a5f3fc;
    }
    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }

    /* Starfield background */
    .starfield {
      position: absolute;
      inset: 0;
      pointer-events: none !important;
      z-index: 0;
      background:
        radial-gradient(1px 1px at 10% 20%, rgba(34,211,238,0.5), transparent),
        radial-gradient(1px 1px at 30% 65%, rgba(34,211,238,0.35), transparent),
        radial-gradient(1.5px 1.5px at 70% 30%, rgba(103,232,249,0.45), transparent),
        radial-gradient(1px 1px at 85% 75%, rgba(34,211,238,0.4), transparent),
        radial-gradient(1px 1px at 50% 50%, rgba(34,211,238,0.25), transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, rgba(103,232,249,0.35), transparent),
        radial-gradient(1px 1px at 60% 15%, rgba(34,211,238,0.4), transparent),
        radial-gradient(1px 1px at 40% 90%, rgba(34,211,238,0.3), transparent),
        radial-gradient(1.5px 1.5px at 90% 40%, rgba(103,232,249,0.35), transparent),
        radial-gradient(1px 1px at 25% 40%, rgba(34,211,238,0.3), transparent);
      background-size: 100% 100%;
    }
    .starfield::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(34,211,238,0.55) 1px, transparent 1px),
        radial-gradient(circle, rgba(103,232,249,0.4) 1px, transparent 1px);
      background-size: 48px 48px, 72px 72px;
      background-position: 0 0, 24px 36px;
      opacity: 0.35;
    }

    .app {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0.75rem 0.85rem 0.65rem;
      max-width: 28rem;
      width: 100%;
      margin: 0 auto;
      gap: 0.65rem;
      pointer-events: auto;
    }
    .top-row, .transcript-card, .reactor-stage, .telemetry {
      position: relative;
      z-index: 3;
      pointer-events: auto;
    }

    /* Top pills row */
    .top-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0.55rem;
      flex-shrink: 0;
    }
    .pill {
      background: rgba(6, 18, 32, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 1rem;
      padding: 0.7rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.08), inset 0 0 12px rgba(6, 182, 212, 0.04);
    }
    .pill-dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 8px #22d3ee;
      flex-shrink: 0;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px #22d3ee; }
      50% { opacity: 0.5; box-shadow: 0 0 4px #22d3ee; }
    }
    .pill-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      min-width: 0;
    }
    .pill-title {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: #67e8f9;
      text-transform: uppercase;
    }
    .pill-sub {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #67e8f9;
      text-transform: uppercase;
      margin-top: 0.1rem;
    }
    .pill-key, #status-pill-wrap {
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(34, 211, 238, 0.2);
    }
    .pill-key {
      justify-content: center;
    }
    .pill-key i {
      color: #22d3ee;
      font-size: 0.95rem;
    }
    .pill-key .pill-title { font-size: 0.68rem; }
    .pill-key .pill-sub { color: #22d3ee; }
    .pill-key:active, #status-pill-wrap:active, #reactor-core:active, #main-mic-button:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Transcript card */
    .transcript-card {
      background: rgba(6, 18, 32, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 1rem;
      padding: 0.75rem 0.9rem 0.85rem;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(6, 182, 212, 0.06);
      position: relative;
      z-index: 2;
    }
    .transcript-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.55rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(6, 182, 212, 0.2);
    }
    .transcript-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #22d3ee;
      text-transform: uppercase;
    }
    .transcript-label i { font-size: 0.85rem; }
    .ready-badge {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.55);
      border-radius: 999px;
      padding: 0.25rem 0.55rem;
      text-transform: uppercase;
    }
    #transcript-feed {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #a5f3fc;
      font-style: italic;
      min-height: 3.2rem;
      max-height: 5.5rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #media-output-container {
      margin-top: 0.5rem;
    }
    #media-output-container.hidden { display: none; }

    /* Center reactor */
    .reactor-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .reactor-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      max-width: 62vw;
      max-height: 62vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
      pointer-events: none;
    }
    #canvas-container canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    .reactor-core {
      position: relative;
      z-index: 3;
      width: 58%;
      height: 58%;
      min-width: 120px;
      min-height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, rgba(18, 48, 72, 0.97) 0%, rgba(4, 14, 28, 0.98) 65%, rgba(2, 8, 18, 1) 100%);
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow:
        0 0 40px rgba(6, 182, 212, 0.18),
        inset 0 0 36px rgba(6, 182, 212, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(34, 211, 238, 0.2);
      padding: 0.75rem 0.5rem;
      box-sizing: border-box;
    }
    .reactor-core i {
      font-size: 1.75rem;
      color: #22d3ee;
      filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.7));
      flex-shrink: 0;
      line-height: 1;
    }
    #main-mic-button {
      appearance: none;
      border: 1px solid rgba(6, 182, 212, 0.45);
      background: rgba(4, 16, 32, 0.95);
      color: #67e8f9;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.2;
      padding: 0.55rem 0.95rem;
      min-height: 2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    #main-mic-button:active {
      transform: scale(0.96);
    }

    /* Bottom telemetry */
    .telemetry {
      flex-shrink: 0;
      background: rgba(6, 18, 32, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 1rem;
      padding: 0.7rem 0.5rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.06);
    }
    .tele-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 0;
    }
    .tele-item i {
      color: #22d3ee;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .tele-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      min-width: 0;
    }
    .tele-label {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #22d3ee;
      text-transform: uppercase;
    }
    .tele-value {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e0f2fe;
      text-transform: uppercase;
    }
    .tele-divider {
      width: 1px;
      height: 1.6rem;
      background: rgba(6, 182, 212, 0.3);
    }

    /* Key modal */
    #key-modal {
      position: fixed !important;
      inset: 0;
      z-index: 9999 !important;
      display: none;
      align-items: flex-start;
      justify-content: center;
      background: rgba(2, 6, 14, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      padding: max(4.5rem, calc(env(safe-area-inset-top, 0px) + 3rem)) 0.85rem max(1rem, env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #key-modal:not(.hidden) { display: flex !important; }
    #key-modal.hidden { display: none !important; }
    #key-modal-panel {
      width: 100%;
      max-width: 22rem;
      background: rgba(6, 18, 32, 0.98);
      border: 1px solid rgba(34, 211, 238, 0.4);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(6, 182, 212, 0.25);
    }
    .modal-head h3 {
      margin: 0;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.8rem;
      color: #67e8f9;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .modal-head button {
      background: none;
      border: none;
      color: #22d3ee;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.25rem;
    }
    .modal-body {
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .modal-body label {
      display: block;
      font-family: ui-monospace, monospace;
      font-size: 0.6rem;
      color: #67e8f9;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      letter-spacing: 0.06em;
    }
    .modal-body input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.55rem;
      background: rgba(2, 10, 20, 0.95);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #e0f2fe;
      font-size: 1rem;
      font-family: ui-monospace, monospace;
      outline: none;
    }
    .modal-status {
      margin: 0 1rem 0.5rem;
      font-family: ui-monospace, monospace;
      font-size: 0.65rem;
      color: rgba(103, 232, 249, 0.75);
      min-height: 1rem;
      text-align: center;
    }
    .modal-status.ok { color: #6ee7b7; }
    .modal-status.err { color: #f87171; }
    .modal-foot {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1rem 1rem;
      border-top: 1px solid rgba(6, 182, 212, 0.2);
    }
    .btn-save {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 0.7rem;
      background: #0891b2;
      color: #020617;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-clear {
      padding: 0.7rem 0.9rem;
      border-radius: 0.7rem;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(15, 23, 42, 0.9);
      color: #f87171;
      font-family: ui-monospace, monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Hidden helpers kept for JS compatibility */
    #hud-mode-text, #status-indicator-dot, #live-clock { display: none; }
  </style>
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>

  <div class="app">
    <!-- Top status pills -->
    <div class="top-row">
      <div class="pill" id="status-pill-wrap" role="button" tabindex="0" title="Tap to speak">
        <span class="pill-dot" id="status-indicator-dot"></span>
        <div class="pill-text">
          <span class="pill-title">ATLASAI CORE</span>
          <span class="pill-sub" id="status-pill">ONLINE</span>
        </div>
      </div>
      <div class="pill pill-key" id="key-pill" role="button" tabindex="0" title="API key settings">
        <i class="fa-solid fa-key"></i>
        <div class="pill-text">
          <span class="pill-title">KEY :</span>
          <span class="pill-sub" id="key-status-text">KEY</span>
        </div>
      </div>
    </div>

    <!-- System transcript -->
    <div class="transcript-card">
      <div class="transcript-head">
        <div class="transcript-label">
          <i class="fa-solid fa-brain"></i>
          <span>SYSTEM TRANSCRIPT</span>
        </div>
        <span class="ready-badge" id="ready-badge">READY</span>
      </div>
      <p id="transcript-feed" role="status" aria-live="polite">"Tap the central reactor or top badge to initiate voice communication..."</p>
      <div id="media-output-container" class="hidden"></div>
    </div>

    <!-- Central reactor -->
    <div class="reactor-stage">
      <div class="reactor-wrap" id="reactor-wrap">
        <div id="canvas-container"></div>
        <div class="reactor-core" id="reactor-core" role="button" tabindex="0" aria-label="Tap to speak" title="Tap to speak">
          <i class="fa-solid fa-microphone" id="mic-icon"></i>
          <button type="button" id="main-mic-button" tabindex="-1">
            <span id="mic-btn-text">TAP TO SPEAK</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom telemetry -->
    <div class="telemetry">
      <div class="tele-item">
        <i class="fa-solid fa-atom"></i>
        <div class="tele-text">
          <span class="tele-label">SYSTEM</span>
          <span class="tele-value" id="hud-mode-text">STANDBY</span>
        </div>
      </div>
      <div class="tele-divider"></div>
      <div class="tele-item">
        <i class="fa-solid fa-bolt"></i>
        <div class="tele-text">
          <span class="tele-label">LATENCY</span>
          <span class="tele-value" id="hud-latency-text">0 ms</span>
        </div>
      </div>
      <div class="tele-divider"></div>
      <div class="tele-item">
        <i class="fa-solid fa-gauge-high"></i>
        <div class="tele-text">
          <span class="tele-label">FPS</span>
          <span class="tele-value" id="fps-text">--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- KEY MODAL -->
  <div id="key-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="key-modal-title">
    <div id="key-modal-panel">
      <div class="modal-head">
        <h3 id="key-modal-title"><i class="fa-solid fa-key"></i> API KEY SETTINGS</h3>
        <button type="button" id="modal-close-btn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div>
          <label for="groq-key-input">GROQ API KEY (PRIMARY)</label>
          <input id="groq-key-input" type="password" placeholder="gsk_..." autocomplete="off" enterkeyhint="next">
        </div>
        <div>
          <label for="gemini-key-input">GEMINI API KEY (SEARCH &amp; GRAPHICS)</label>
          <input id="gemini-key-input" type="password" placeholder="AIzaSy..." autocomplete="off" enterkeyhint="done">
        </div>
      </div>
      <p class="modal-status" id="key-save-status"></p>
      <div class="modal-foot">
        <button type="button" class="btn-save" id="btn-save">SAVE KEYS</button>
        <button type="button" class="btn-clear" id="btn-clear">CLEAR</button>
      </div>
    </div>
  </div>

  <!-- Firebase module — cloud key sync -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'atlas-ai-core';

    function resolveFirebaseConfig() {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          return typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        }
      } catch (e) {}
      try {
        const stored = window.atlasStore.getItem('ATLAS_FIREBASE_CONFIG');
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return null;
    }

    let db = null;
    let auth = null;
    let currentUser = null;
    let authReady = null;
    let authReadyResolve = null;

    function resetAuthGate() {
      authReady = new Promise((resolve) => { authReadyResolve = resolve; });
    }
    resetAuthGate();

    async function waitForAuth(ms = 8000) {
      if (currentUser && db) return currentUser;
      return Promise.race([
        authReady,
        new Promise((resolve) => setTimeout(() => resolve(currentUser), ms))
      ]);
    }

    function keysDocRef() {
      return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'config', 'user_keys');
    }

    async function loadKeysFromCloud() {
      if (!db || !currentUser) return false;
      try {
        const docSnap = await getDoc(keysDocRef());
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.groqKey) window.atlasStore.setItem('ATLAS_GROQ_KEY', data.groqKey);
          if (data.geminiKey) window.atlasStore.setItem('ATLAS_GEMINI_KEY', data.geminiKey);
          window.updateKeyBadge && window.updateKeyBadge();
          return true;
        }
      } catch (err) {
        console.warn('Cloud load failed:', err);
      }
      return false;
    }

    async function saveKeysToCloud(groqKey, geminiKey) {
      await waitForAuth();
      if (!db || !currentUser) {
        return { ok: false, reason: 'cloud_unavailable' };
      }
      try {
        await setDoc(keysDocRef(), {
          groqKey: groqKey || '',
          geminiKey: geminiKey || '',
          updatedAt: new Date().toISOString()
        }, { merge: true });
        return { ok: true };
      } catch (err) {
        console.warn('Cloud save failed:', err);
        return { ok: false, reason: err.message || 'save_failed' };
      }
    }

    async function clearKeysFromCloud() {
      await waitForAuth();
      if (!db || !currentUser) return { ok: false, reason: 'cloud_unavailable' };
      try {
        await deleteDoc(keysDocRef());
        return { ok: true };
      } catch (err) {
        console.warn('Cloud clear failed:', err);
        return { ok: false, reason: err.message || 'clear_failed' };
      }
    }

    window.cloudSaveKeys = saveKeysToCloud;
    window.cloudClearKeys = clearKeysFromCloud;
    window.cloudLoadKeys = loadKeysFromCloud;
    window.cloudIsReady = () => !!(db && currentUser);

    try {
      const firebaseConfig = resolveFirebaseConfig();

    };

    window.processUserQuery = async function(promptText) {
      if (activeRequest) activeRequest.abort();
      activeRequest = new AbortController();
      const signal = activeRequest.signal;
      const seq = ++requestSeq;
      window.clearMediaOutput();
      window.playAtlasSound('thinking');
      window.setSystemState('THINKING');
      const startTime = performance.now();
      const apiKey = window.sanitizeKey(window.atlasStore.getItem('ATLAS_GROQ_KEY') || '');
      let answer = '';
      let groqAttempted = false;

      if (apiKey && (apiKey.startsWith('gsk_') || apiKey.length > 20)) {
        groqAttempted = true;
        const modelChain = [
          window.sanitizeModel(window.ATLAS_MODELS.groq),
          ...((window.ATLAS_MODELS.groqFallbacks || []).map(window.sanitizeModel))
        ];
        let lastErr = '';
        for (const targetModel of modelChain) {
          try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
              },
              signal,
              body: JSON.stringify({
                model: targetModel,
                messages: [
                  { role: 'system', content: 'You are ATLAS, an advanced AI system. Keep answers extremely concise and clear under 30 words.' },
                  { role: 'user', content: promptText }
                ],
                max_tokens: 180
              })
            });
            if (res.ok) {
              const data = await res.json();
              answer = data.choices?.[0]?.message?.content || '';
              if (answer) break;
            } else {
              const errData = await res.json().catch(() => ({}));
              lastErr = errData.error?.message || `HTTP ${res.status}`;
              // Try next model on not-found / access errors
              if (/does not exist|not found|do not have access|model_not_found/i.test(lastErr)) {
                continue;
              }
              answer = `[GROQ ERROR: ${lastErr}]`;
              break;
            }
          } catch (e) {
            if (e.name === 'AbortError') return;
            lastErr = 'CONNECTION FAILED';
            answer = `[GROQ CONNECTION FAILED]`;
            break;
          }
        }
        if (!answer && lastErr) answer = `[GROQ ERROR: ${lastErr}]`;
      }

      if (!answer && !groqAttempted) {
        try {
          const models = ['openai-fast', 'mistral', 'llama', 'qwen'].map(window.sanitizeModel);
          const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;
          const requests = models.map(m =>
            fetch(`https://text.pollinations.ai/${encodeURIComponent("You are ATLAS. Answer concisely under 25 words: " + promptText)}?model=${m}&cache=true&private=true`, {
              signal: controller ? controller.signal : undefined
            }).then(r => r.ok ? r.text() : Promise.reject())
          );
          answer = await Promise.any(requests);
          if (timeoutId) clearTimeout(timeoutId);
        } catch (e) {
          answer = "No response. Add a Groq key with the KEY badge, or check your connection.";
        }
      }

      const latency = Math.round(performance.now() - startTime);
      if (seq !== requestSeq) return;
      const latencyText = document.getElementById('hud-latency-text');
      if (latencyText) latencyText.innerText = `${latency} ms`;
      answer = (answer || '').replace(/^["']|["']$/g, '').trim();
      const feed = document.getElementById('transcript-feed');
      if (feed) feed.innerText = `"${answer}"`;
      window.playAtlasSound('complete');
      window.speakLinePromise(answer);
    };

    function setFeed(text) {
      const feed = document.getElementById('transcript-feed');
      if (feed) feed.innerText = `"${text}"`;
    }

    // Commands must start the utterance (after an optional "atlas"), so "withdraw cash" no longer triggers image generation.
    function routeTranscript(transcript) {
      const t = transcript.trim();
      const text = t.replace(/^(hey\s+)?atlas[,.\s]+/i, '') || t;
      if (/\b(introduce yourself|who are you)\b/i.test(text)) return triggerAtlasIntroduction();
      if (/\b(system status|diagnostics)\b/i.test(text)) return window.executeSystemDiagnostics();
      let m = text.match(/^search(?:\s+for)?\s+(.+)/i);
      if (m) return window.performGroundedSearch(m[1].trim());
      m = text.match(/^(?:generate (?:an? )?image(?: of)?|make an image(?: of)?|draw)\s+(.+)/i);
      if (m) return window.generateAiImage(m[1].trim());
      return window.processUserQuery(text);
    }

    const SPEECH_ERRORS = {
      'not-allowed': 'Microphone access is blocked. Allow it in your browser settings.',
      'service-not-allowed': 'Speech recognition is blocked on this device.',
      'no-speech': 'No speech detected. Tap to try again.',
      'audio-capture': 'No microphone found.',
      'network': 'Speech service unreachable. Check your connection.'
    };

    // "not-allowed" is also what browsers report when the speech service refuses, even with the mic granted.
    async function explainMicBlock() {
      let state = null;
      try { state = (await navigator.permissions.query({ name: 'microphone' })).state; } catch (e) {}
      const insecure = !window.isSecureContext || location.protocol === 'file:';
      if (state === 'denied') setFeed('Microphone is blocked for this page. Allow it in site settings, then reload.');
      else if (insecure) setFeed('Speech recognition is refused on pages not served over https. Host this file or open it from localhost.');
      else if (state === 'granted') setFeed('Microphone is allowed, but the speech service refused it. On iPhone, turn on Settings > Siri > Dictation. In an in-app browser, open the page in Safari or Chrome.');
      else setFeed('Speech recognition was refused. If the microphone is allowed, turn on Dictation (iPhone) or Google voice typing (Android), or open the page in Safari or Chrome.');
    }

    function initSpeechModule() {
      if (recognition) return recognition;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      recognition = new SR();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onstart = () => {
        isListening = true;
        window.setSystemState('LISTENING');
        window.playAtlasSound('activate');
      };
      recognition.onresult = (event) => {
        isListening = false;
        const transcript = event.results[0][0].transcript;
        setFeed(transcript);
        routeTranscript(transcript);
      };
      recognition.onerror = (event) => {
        isListening = false;
        isPresenting = false;
        window.setSystemState('STANDBY');
        if (event.error === 'aborted') return;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') { explainMicBlock(); return; }
        setFeed(SPEECH_ERRORS[event.error] || `Speech error: ${event.error}`);
      };
      recognition.onend = () => {
        isListening = false;
        if (currentState === 'LISTENING') window.setSystemState('STANDBY');
      };
      return recognition;
    }

    window.toggleSpeechRecognition = function() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      isPresenting = false;
      const rec = initSpeechModule();
      if (!rec) {
        setFeed('Speech recognition unavailable on this device.');
        return;
      }
      if (isListening) {
        try { rec.stop(); } catch (e) {}
        isListening = false;
        window.setSystemState('STANDBY');
        return;
      }
      try {
        rec.start();
      } catch (e) {
        try { rec.abort(); } catch (err) {}
        setTimeout(() => { try { rec.start(); } catch (err) {} }, 150);
      }
    };

    async function triggerAtlasIntroduction() {
      if (isPresenting) return;
      isPresenting = true;
      const pitchLines = [
        "Allow me to introduce myself. I am ATLAS, your AI Operating Core.",
        "I provide high-speed inference, grounded web telemetry, and real-time system diagnostics at your command.",
        "Systems online and fully operational."
      ];
      for (const line of pitchLines) {
        const feed = document.getElementById('transcript-feed');
        if (feed) feed.innerText = `"${line}"`;
        await window.speakLinePromise(line);
      }
      isPresenting = false;
      window.setSystemState('STANDBY');
    }

    window.speakLinePromise = function(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) {
          isPresenting = false;
          window.setSystemState('STANDBY');
          resolve();
          return;
        }
        try { window.speechSynthesis.cancel(); } catch (e) {}
        window.setSystemState('SPEAKING');
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.95;
        let completed = false;
        const completeHandler = () => {
          if (completed) return;
          completed = true;
          isPresenting = false;
          window.setSystemState('STANDBY');
          resolve();
        };
        utterance.onend = completeHandler;
        utterance.onerror = completeHandler;
        try {
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          completeHandler();
        }
      });
    };

    // Event delegation — works even if inline handlers are blocked by the webview
    document.addEventListener('click', function(e) {
      var t = e.target;
      if (!t) return;
      // climb up to a known control
      var node = t;
      for (var i = 0; i < 6 && node; i++) {
        var id = node.id;
        if (id === 'key-pill') { e.preventDefault(); window.openKeyModal(); return; }
        if (id === 'status-pill-wrap' || id === 'reactor-core' || id === 'main-mic-button') {
          e.preventDefault();
          window.toggleSpeechRecognition();
          return;
        }
        if (id === 'btn-save') { e.preventDefault(); window.saveKey(); return; }
        if (id === 'btn-clear') { e.preventDefault(); window.clearKey(); return; }
        if (id === 'modal-close-btn') { e.preventDefault(); window.closeKeyModal(); return; }
        if (id === 'key-modal' && t === node) { window.closeKeyModal(); return; }
        node = node.parentElement;
      }
    }, true);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { window.closeKeyModal(); return; }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target;
      if (el && el.getAttribute && el.getAttribute('role') === 'button') { e.preventDefault(); el.click(); }
    });

    function bootAtlas() {
      try { init3DCore(); } catch (e) { console.warn(e); }
      try { initSpeechModule(); } catch (e) { console.warn(e); }
      try { window.updateKeyBadge(); } catch (e) { console.warn(e); }
      window.atlasStore.hydrate().then(() => { try { window.updateKeyBadge(); } catch (e) {} });
    }
    if (document.readyState === 'complete') bootAtlas();
    else window.addEventListener('load', bootAtlas);
    setTimeout(function() {
      var c = document.getElementById('canvas-container');
      if (c && !c.querySelector('canvas') && typeof THREE !== 'undefined') init3DCore(0);
    }, 600);
  </script>
</body>
</html>
